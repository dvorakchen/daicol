services:
  db:
    image: docker.1ms.run/postgres:16
    container_name: daicol-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: daicol
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d daicol']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ~/data/daicol/postgres:/var/lib/postgresql/data
  minio:
    image: docker.1ms.run/minio/minio
    container_name: daicol-minio
    restart: always
    ports:
      # - "9000:9000"
      - "9090:9090"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    volumes:
      - ~/data/daicol/minio:/data
    command: server /data --console-address ":9090" -address ":9000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daicol-app
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://user:password@db:5432/daicol
      JWT_KEY: your-secret-jwt-key
      VOLCENGINE_API_KEY:
      PUBLIC_HOST: https://localhost:3000/
      PUBLIC_BEIAN_NUMBER: 苏@BEIAN_NUMBER
